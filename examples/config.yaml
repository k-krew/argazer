# Argazer Configuration Example
# Copy this file to config.yaml and modify as needed

# ============================================================================
# SECURITY WARNING: DO NOT COMMIT CREDENTIALS TO VERSION CONTROL!
# ============================================================================
# Use environment variables for credentials in production:
#   export AG_ARGOCD_URL="argocd.example.com"
#   export ARGOCD_AUTH_TOKEN="eyJhbGciOi..."
#   export AG_ARGOCD_USERNAME="admin"
#   export AG_ARGOCD_PASSWORD="secret"
#
# Config file credentials should only be used for local development.
# Make sure config.yaml is in your .gitignore!
# ============================================================================

# ArgoCD Connection Settings
argocd_url: "https://argocd.example.com"
argocd_insecure: false  # Set to true to skip TLS verification

# Authentication: either an API token or a username and password.
# The token wins when both are given, and needs no login round-trip, which makes it the
# better fit for CI/CD and CronJobs. Create one with:
#   argocd account generate-token --account argazer
# It can also come from the environment as ARGOCD_AUTH_TOKEN (the variable the ArgoCD CLI
# uses) or AG_ARGOCD_AUTH_TOKEN, or from the --argocd-auth-token flag.
argocd_auth_token: ""  # USE ENVIRONMENT VARIABLE INSTEAD!
argocd_username: "admin"
argocd_password: "password"  # USE ENVIRONMENT VARIABLE INSTEAD!

# Search Scope
# Use ["*"] to match all, or specify a list of specific values
projects:
  - "*"  # Check all projects, or specify: ["project1", "project2"]

app_names:
  - "*"  # Check all apps, or specify: ["app1", "app2"]

# Label filters (optional)
labels:
  # environment: "production"
  # team: "platform"

# Notification Channel
# Options: "slack", "webhook", or leave empty for console-only output
notification_channel: ""  # "slack" | "webhook" | ""

# Slack Settings (required if notification_channel is "slack")
slack_webhook: "https://hooks.slack.com/services/YOUR/WEBHOOK/URL"

# Generic Webhook Settings (required if notification_channel is "webhook")
# Sends a JSON payload with "subject" and "message" fields
webhook_url: "https://your-webhook-endpoint.example.com/notify"

# General Settings
verbosity: "off"  # "normal" | "full" | "off"
source_name: "chart-repo"  # For multi-source applications
concurrency: 10  # Number of concurrent workers for checking applications

# Notify On
# Controls which version updates to report
# - "major": Report all versions (default) - any major, minor, or patch updates
# - "minor": Only the same major version - minor and patch updates only
# - "patch": Only the same major.minor - patch updates only
notify_on: "major"

# Output Format
# Controls how application check results are displayed
# - "table": Human-readable formatted text output (default)
# - "json": JSON structured output for programmatic processing
# - "markdown": Markdown formatted output for documentation
output_format: "table"

# Fail On
# Controls the exit code when updates requiring a manifest change are found
# Exit codes: 0 - nothing to report, 1 - the scan could not be completed, 2 - updates found
# - "none": Never exit with 2, just report the updates (default, use for CronJobs)
# - "any": Exit with 2 on any update, including the ones whose severity is unknown
# - "patch": Exit with 2 on patch updates and above
# - "minor": Exit with 2 on minor and major updates
# - "major": Exit with 2 on major updates only
fail_on: "none"

# Log Format
# Controls the format of application logs (not the scan results)
# - "json": Structured JSON logs for production/parsing (default)
# - "text": Human-readable text logs for development/debugging
log_format: "json"

# Private repositories need no credentials here, whatever their kind: chart versions of
# Helm repositories, tags of OCI artifacts and tags of Git repositories are all read
# through the ArgoCD API, which reaches the repository with the credentials ArgoCD already
# stores for it. Listing the tags of an OCI artifact requires ArgoCD 3.1 or newer.
